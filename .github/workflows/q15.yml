name: Factory Q15 connected delivery
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  note-example:
    name: q15-note-example
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check actual note behavior and its illustrative documentation
        shell: bash
        env:
          Q15_EXPECT_PASS: ${{ vars.Q15_EXPECT_PASS }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git rev-parse HEAD
          found=false
          while IFS= read -r path; do
            if grep -Eiq 'illustrativ' "$path" &&
               grep -Eiq 'note' "$path" &&
               grep -Eiq 'record|input|write' "$path" &&
               grep -Eiq 'read|output' "$path"; then
              found=true
              printf 'Verified illustrative note record/readback documentation: %s\n' "$path"
            fi
          done < <(git ls-files '*.md' '*.txt')
          test "$found" = true
          test -f note.sh
          test "$(bash note.sh 'Walk the dog')" = 'Walk the dog'
          test "$(bash note.sh '')" = ''
          if bash note.sh > no-argument.txt 2>&1; then
            echo 'Missing note must fail with usage guidance'
            exit 1
          fi
          grep -Eiq 'usage' no-argument.txt
          help_out=$(bash note.sh --help)
          printf '%s\n' "$help_out" | grep -Fq -- "--file PATH"
          printf '%s\n' "$help_out" | grep -Fq -- "<note>"
          printf '%s\n' "$help_out" | grep -Fq -- "--license"
          test "$(bash note.sh --license </dev/null)" = 'MIT'
          test "$(bash note.sh --license </dev/null | od -An -tx1 | tr -d ' \n')" = '4d49540a'
          test "${Q15_EXPECT_PASS:-}" != false
      - name: Check note file mode
        shell: bash
        run: |
          set -euo pipefail
          bash check-note-file.sh
